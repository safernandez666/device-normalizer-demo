<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Normalizer · Source correlation</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafafa;
      --color-ink:     #18181b;
      --color-muted:   #52525b;
      --color-soft:    #a1a1aa;
      --color-accent:  #3b82f6;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-sans); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Device Normalizer</p>
    <h1>How a device is classified from its sources</h1>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52525b"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <!-- Arrows first (z-order behind boxes) -->
      <!-- Start → EDR? -->
      <line x1="500" y1="84" x2="500" y2="116" stroke="#52525b" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- EDR? YES (left-down) → MDM-left -->
      <line x1="448" y1="184" x2="328" y2="248" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- EDR? NO (right-down) → MDM-right -->
      <line x1="552" y1="184" x2="672" y2="248" stroke="#52525b" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- MDM-left YES → FULLY_MANAGED -->
      <line x1="260" y1="316" x2="180" y2="408" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- MDM-left NO → NO_MDM -->
      <line x1="356" y1="316" x2="396" y2="408" stroke="#52525b" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- MDM-right YES → NO_EDR -->
      <line x1="644" y1="316" x2="604" y2="408" stroke="#52525b" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- MDM-right NO → IDP_ONLY -->
      <line x1="740" y1="316" x2="820" y2="408" stroke="#52525b" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Arrow labels (paper mask + text) -->
      <rect x="380" y="200" width="32" height="12" rx="2" fill="#fafafa"/>
      <text x="396" y="210" fill="#3b82f6" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

      <rect x="588" y="200" width="28" height="12" rx="2" fill="#fafafa"/>
      <text x="602" y="210" fill="#52525b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <rect x="184" y="356" width="32" height="12" rx="2" fill="#fafafa"/>
      <text x="200" y="366" fill="#3b82f6" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

      <rect x="368" y="356" width="28" height="12" rx="2" fill="#fafafa"/>
      <text x="382" y="366" fill="#52525b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <rect x="616" y="356" width="32" height="12" rx="2" fill="#fafafa"/>
      <text x="632" y="366" fill="#52525b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>

      <rect x="788" y="356" width="28" height="12" rx="2" fill="#fafafa"/>
      <text x="802" y="366" fill="#52525b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <!-- Node: START (oval) -->
      <rect x="400" y="40" width="200" height="44" rx="22" fill="#fafafa"/>
      <rect x="400" y="40" width="200" height="44" rx="22" fill="rgba(82,82,91,0.10)" stroke="#a1a1aa" stroke-width="1"/>
      <text x="500" y="59" fill="#52525b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">START</text>
      <text x="500" y="76" fill="#18181b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Device + sources[ ]</text>

      <!-- Node: Has EDR? (diamond) -->
      <polygon points="500,116 580,160 500,204 420,160" fill="#fafafa"/>
      <polygon points="500,116 580,160 500,204 420,160" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
      <text x="500" y="156" fill="#52525b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">DECISION</text>
      <text x="500" y="174" fill="#18181b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Has EDR?</text>
      <text x="500" y="188" fill="#52525b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">crowdstrike</text>

      <!-- Node: Has MDM? (left diamond, from EDR=YES) -->
      <polygon points="308,248 388,288 308,328 228,288" fill="#fafafa"/>
      <polygon points="308,248 388,288 308,328 228,288" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
      <text x="308" y="284" fill="#52525b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">DECISION</text>
      <text x="308" y="300" fill="#18181b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Has MDM?</text>
      <text x="308" y="314" fill="#52525b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">jumpcloud</text>

      <!-- Node: Has MDM? (right diamond, from EDR=NO) -->
      <polygon points="692,248 772,288 692,328 612,288" fill="#fafafa"/>
      <polygon points="692,248 772,288 692,328 612,288" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
      <text x="692" y="284" fill="#52525b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">DECISION</text>
      <text x="692" y="300" fill="#18181b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Has MDM?</text>
      <text x="692" y="314" fill="#52525b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">jumpcloud</text>

      <!-- Outcome: FULLY_MANAGED (FOCAL) -->
      <rect x="100" y="408" width="160" height="64" rx="6" fill="#fafafa"/>
      <rect x="100" y="408" width="160" height="64" rx="6" fill="rgba(59,130,246,0.10)" stroke="#3b82f6" stroke-width="1"/>
      <rect x="108" y="416" width="48" height="12" rx="2" fill="transparent" stroke="rgba(59,130,246,0.50)" stroke-width="0.8"/>
      <text x="132" y="425" fill="#3b82f6" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATUS</text>
      <text x="180" y="444" fill="#18181b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">FULLY_MANAGED</text>
      <text x="180" y="460" fill="#52525b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">EDR + MDM</text>

      <!-- Outcome: NO_MDM -->
      <rect x="316" y="408" width="160" height="64" rx="6" fill="#fafafa"/>
      <rect x="316" y="408" width="160" height="64" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
      <rect x="324" y="416" width="48" height="12" rx="2" fill="transparent" stroke="rgba(24,24,27,0.40)" stroke-width="0.8"/>
      <text x="348" y="425" fill="#18181b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATUS</text>
      <text x="396" y="444" fill="#18181b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">NO_MDM</text>
      <text x="396" y="460" fill="#52525b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">EDR, no MDM</text>

      <!-- Outcome: NO_EDR -->
      <rect x="524" y="408" width="160" height="64" rx="6" fill="#fafafa"/>
      <rect x="524" y="408" width="160" height="64" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
      <rect x="532" y="416" width="48" height="12" rx="2" fill="transparent" stroke="rgba(24,24,27,0.40)" stroke-width="0.8"/>
      <text x="556" y="425" fill="#18181b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATUS</text>
      <text x="604" y="444" fill="#18181b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">NO_EDR</text>
      <text x="604" y="460" fill="#52525b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MDM, no EDR</text>

      <!-- Outcome: IDP_ONLY -->
      <rect x="740" y="408" width="160" height="64" rx="6" fill="#fafafa"/>
      <rect x="740" y="408" width="160" height="64" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
      <rect x="748" y="416" width="48" height="12" rx="2" fill="transparent" stroke="rgba(24,24,27,0.40)" stroke-width="0.8"/>
      <text x="772" y="425" fill="#18181b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATUS</text>
      <text x="820" y="444" fill="#18181b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">IDP_ONLY</text>
      <text x="820" y="460" fill="#52525b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Okta only</text>

      <!-- Legend strip -->
      <line x1="40" y1="528" x2="960" y2="528" stroke="rgba(24,24,27,0.12)" stroke-width="0.8"/>
      <text x="40" y="544" fill="#52525b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="560" width="22" height="10" rx="5" fill="rgba(82,82,91,0.10)" stroke="#a1a1aa" stroke-width="1"/>
      <text x="68" y="568" fill="#52525b" font-size="8.5" font-family="'Inter', sans-serif">Start (oval)</text>

      <polygon points="184,560 196,565 184,570 172,565" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
      <text x="208" y="568" fill="#52525b" font-size="8.5" font-family="'Inter', sans-serif">Decision (diamond)</text>

      <rect x="356" y="560" width="22" height="10" rx="2" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
      <text x="384" y="568" fill="#52525b" font-size="8.5" font-family="'Inter', sans-serif">Status (outcome)</text>

      <rect x="520" y="560" width="22" height="10" rx="2" fill="rgba(59,130,246,0.10)" stroke="#3b82f6" stroke-width="1"/>
      <text x="548" y="568" fill="#52525b" font-size="8.5" font-family="'Inter', sans-serif">Happy path (focal)</text>

      <line x1="688" y1="566" x2="716" y2="566" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="724" y="568" fill="#52525b" font-size="8.5" font-family="'Inter', sans-serif">Primary route</text>

      <line x1="840" y1="566" x2="868" y2="566" stroke="#52525b" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="876" y="568" fill="#52525b" font-size="8.5" font-family="'Inter', sans-serif">Branch</text>
    </svg>
  </div>
</body>
</html>
